<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Perception Agent (SIH 26171)</title>
  <script type="module" crossorigin src="/sidepanel.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.js">
  <link rel="stylesheet" crossorigin href="/assets/sidepanel.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Component -->
    <header class="app-header">
      <div class="brand-badge">
        <div class="brand-logo">ISRO</div>
        <div class="brand-title">SIH 26171 Agent</div>
      </div>
      <div class="system-status">
        <span class="status-dot"></span>
        <span id="statusText">ON-DEVICE PERCEIVING</span>
      </div>
    </header>

    <!-- Telemetry Dashboard -->
    <div class="telemetry-grid">
      <div class="metric-card">
        <span class="metric-label">Perception Latency</span>
        <span class="metric-value" id="valLatency">-- ms</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Active SOM Marks</span>
        <span class="metric-value" id="valMarks">0</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Hardware Engine</span>
        <span class="metric-value" id="valHardware" style="font-size: 11px;">WebGPU</span>
      </div>
    </div>

    <!-- Privacy Firewall Status -->
    <div class="firewall-banner">
      <div class="firewall-status">
        <span>🛡️ Local Privacy Firewall Active</span>
      </div>
      <span id="valPrivacyMasks" style="font-weight: 700; font-family: var(--font-mono);">0 Masked Zones</span>
    </div>

    <!-- Main Agent Control Card -->
    <div class="control-card">
      <div class="section-title">
        <span>Agent Goal / Command</span>
        <span style="font-size: 9px; color: var(--accent-cyan);">ON-DEVICE VLM</span>
      </div>
      <div class="input-group">
        <textarea 
          id="promptInput" 
          class="prompt-textarea" 
          placeholder="e.g. Search for NISAR telemetry data, or click mark #3..."
        ></textarea>
      </div>
      <div class="button-group">
        <button id="btnPerceive" class="btn btn-primary">
          <span>👁️ Perceive Screen</span>
        </button>
        <button id="btnExecute" class="btn btn-secondary">
          <span>⚡ Execute Step</span>
        </button>
      </div>
      <div class="button-group" style="margin-top: 4px;">
        <button id="btnToggleSOM" class="btn btn-secondary" style="font-size: 11px;">
          <span>🏷️ Toggle SOM Tags</span>
        </button>
      </div>
    </div>

    <!-- Execution Trajectory & Logs -->
    <div class="perception-viewport">
      <div class="section-title">
        <span>Execution Trajectory Log</span>
        <span id="stepCount" style="font-size: 10px; color: var(--text-muted);">0 Steps</span>
      </div>
      <div class="trajectory-list" id="trajectoryList">
        <div class="step-item">
          <span>System Initialized: On-device perception ready.</span>
          <span class="step-latency">0ms</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
