<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Controller</title>
  <script type="module" crossorigin src="../../sidepanel.js"></script>
  <link rel="modulepreload" crossorigin href="../../assets/modulepreload-polyfill.js">
  <link rel="stylesheet" crossorigin href="../../assets/sidepanel.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand-badge">
        <div class="brand-title">ISRO Browser Agent</div>
        <div class="brand-subtitle">SIH 26171</div>
      </div>
      <div class="system-status">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <div class="telemetry-grid">
      <div class="metric-card">
        <span class="metric-label">Engine</span>
        <span class="metric-value" id="valHardware">WebGPU</span>
      </div>
      <div class="metric-card">
        <span class="metric-label">Latency</span>
        <span class="metric-value" id="valLatency">-- ms</span>
      </div>
    </div>

    <div class="firewall-banner">
      <div class="firewall-status">Local Privacy Firewall</div>
      <span id="valPrivacyMasks" class="text-mono text-muted">0 Masked</span>
    </div>

    <div class="control-card">
      <div class="section-title">Instructions</div>
      <textarea 
        id="promptInput" 
        class="prompt-textarea" 
        placeholder="e.g. Find the download link for the NISAR dataset..."
      ></textarea>
      
      <div class="button-group">
        <button id="btnPerceive" class="btn btn-secondary">Analyze Page</button>
        <button id="btnExecute" class="btn btn-primary">Execute</button>
      </div>
      <div class="button-group">
        <button id="btnToggleSOM" class="btn btn-secondary">Toggle Developer Tags</button>
      </div>
    </div>

    <div class="perception-viewport">
      <div class="section-title" style="display: flex; justify-content: space-between;">
        <span>Activity Log</span>
        <span id="stepCount" class="text-muted text-mono">0</span>
      </div>
      <div class="trajectory-list" id="trajectoryList">
        <div class="step-item">
          <span>Agent initialized.</span>
          <span class="step-latency">0ms</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
